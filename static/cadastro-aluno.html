<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .form-header h2 {
            color: #1f2937;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-label .required {
            color: #ef4444;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.25);
        }

        .foto-preview {
            width: 150px;
            height: 200px;
            border: 3px dashed #d1d5db;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            overflow: hidden;
            background: #f9fafb;
        }

        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-preview i {
            font-size: 3rem;
            color: #9ca3af;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-voltar {
            color: #6b7280;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .btn-voltar:hover {
            color: var(--primary-color);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <a href="index.html" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>

            <div class="form-header">
                <i class="fas fa-user-graduate"></i>
                <h2>Cadastro do Aluno</h2>
                <p class="text-muted">Preencha seus dados abaixo</p>
            </div>

            <div id="alertContainer"></div>

            <form id="formAluno" enctype="multipart/form-data">
                <!-- Dados Pessoais -->
                <div class="mb-4">
                    <label class="form-label">Nome Completo <span class="required">*</span></label>
                    <input type="text" class="form-control" name="nome" id="inputNome" pattern="[A-Za-zÀ-ÿ\s']+" title="Apenas letras e espaços" required>
                    <small class="text-muted">Apenas letras</small>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Turma <span class="required">*</span></label>
                        <input type="text" class="form-control" name="turma" id="inputTurma" placeholder="Ex: 3º A" maxlength="30" required>
                        <small class="text-muted"><span id="contadorTurma">0</span>/30 caracteres</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ano de Formatura <span class="required">*</span></label>
                        <input type="number" class="form-control" name="ano_formatura" id="inputAno" min="2024" max="2035" maxlength="4" placeholder="2025" required>
                        <small class="text-muted">4 dígitos (ex: 2025)</small>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Escola/Universidade <span class="required">*</span></label>
                    <input list="escolasBrasil" class="form-control" name="escola" id="inputEscola" placeholder="Digite ou selecione" autocomplete="off" required>
                    <datalist id="escolasBrasil">
                        <!-- Universidades Federais -->
                        <option value="Universidade de São Paulo (USP)">
                        <option value="Universidade Federal do Rio de Janeiro (UFRJ)">
                        <option value="Universidade Estadual de Campinas (UNICAMP)">
                        <option value="Universidade Federal de Minas Gerais (UFMG)">
                        <option value="Universidade Federal do Rio Grande do Sul (UFRGS)">
                        <option value="Universidade de Brasília (UnB)">
                        <option value="Universidade Federal de São Paulo (UNIFESP)">
                        <option value="Universidade Federal de Santa Catarina (UFSC)">
                        <option value="Universidade Federal do Paraná (UFPR)">
                        <option value="Universidade Federal da Bahia (UFBA)">
                        <option value="Universidade Federal de Pernambuco (UFPE)">
                        <option value="Universidade Federal Fluminense (UFF)">
                        <option value="Universidade Federal do Ceará (UFC)">
                        <option value="Universidade Federal de Goiás (UFG)">
                        <option value="Universidade Federal do Pará (UFPA)">
                        <option value="Universidade Federal de São Carlos (UFSCar)">
                        <option value="Universidade Federal do Espírito Santo (UFES)">
                        <option value="Universidade Federal de Juiz de Fora (UFJF)">
                        <option value="Universidade Federal do Amazonas (UFAM)">
                        <option value="Universidade Federal de Viçosa (UFV)">
                        <option value="Universidade Federal do Rio Grande do Norte (UFRN)">
                        <option value="Universidade Federal de Santa Maria (UFSM)">
                        <option value="Universidade Federal de Uberlândia (UFU)">
                        <option value="Universidade Federal da Paraíba (UFPB)">
                        <option value="Universidade Federal de Sergipe (UFS)">
                        <option value="Universidade Federal do Maranhão (UFMA)">
                        <option value="Universidade Federal de Mato Grosso (UFMT)">
                        <option value="Universidade Federal de Pelotas (UFPel)">
                        <option value="Universidade Federal Rural do Rio de Janeiro (UFRRJ)">
                        <option value="Universidade Federal de Lavras (UFLA)">
                        
                        <!-- Universidades Estaduais -->
                        <option value="Universidade Estadual Paulista (UNESP)">
                        <option value="Universidade do Estado do Rio de Janeiro (UERJ)">
                        <option value="Universidade Estadual de Londrina (UEL)">
                        <option value="Universidade Estadual de Maringá (UEM)">
                        <option value="Universidade Estadual de Ponta Grossa (UEPG)">
                        
                        <!-- Universidades Particulares -->
                        <option value="Pontifícia Universidade Católica do Rio de Janeiro (PUC-Rio)">
                        <option value="Pontifícia Universidade Católica de São Paulo (PUC-SP)">
                        <option value="Pontifícia Universidade Católica do Rio Grande do Sul (PUC-RS)">
                        <option value="Pontifícia Universidade Católica de Minas Gerais (PUC-MG)">
                        <option value="Pontifícia Universidade Católica do Paraná (PUC-PR)">
                        <option value="Universidade Presbiteriana Mackenzie">
                        <option value="Fundação Getúlio Vargas (FGV)">
                        <option value="Insper Instituto de Ensino e Pesquisa">
                        <option value="Universidade Anhembi Morumbi">
                        <option value="Universidade Paulista (UNIP)">
                        <option value="Universidade Nove de Julho (UNINOVE)">
                        <option value="Centro Universitário FAM">
                        
                        <!-- Escolas Técnicas -->
                        <option value="Instituto Federal de São Paulo (IFSP)">
                        <option value="Centro Paula Souza (ETEC)">
                        <option value="Colégio Técnico Industrial (CTI)">
                        
                        <option value="Outra escola não listada">
                    </datalist>
                    <small class="text-muted">Comece digitando ou selecione da lista</small>
                </div>

                <!-- Campo para "Outra escola" -->
                <div class="mb-4" id="divOutraEscola" style="display: none;">
                    <label class="form-label">Nome da Escola/Universidade <span class="required">*</span></label>
                    <input type="text" class="form-control" name="outra_escola" id="inputOutraEscola" maxlength="150" placeholder="Digite o nome completo da instituição">
                    <small class="text-muted">Máximo 150 caracteres</small>
                </div>

                <!-- Contato -->
                <div class="mb-4">
                    <label class="form-label">E-mail <span class="required">*</span></label>
                    <input type="email" class="form-control" name="email" id="inputEmail" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">WhatsApp <span class="required">*</span></label>
                    <input type="text" class="form-control" name="whatsapp" id="inputWhatsApp" placeholder="(00) 00000-0000" maxlength="15" required>
                </div>

                <!-- CEP e Endereço -->
                <div class="mb-4">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" name="cep" id="inputCEP" placeholder="00000-000" maxlength="9">
                    <small class="text-muted">Opcional - Preencha para autocompletar endereço</small>
                </div>

                <!-- Campos de endereço (aparecem após buscar CEP) -->
                <div id="camposEndereco" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label">Logradouro</label>
                        <input type="text" class="form-control" name="logradouro" id="inputLogradouro" readonly>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Bairro</label>
                            <input type="text" class="form-control" name="bairro" id="inputBairro" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número <span class="required">*</span></label>
                            <input type="text" class="form-control" name="numero" id="inputNumero" placeholder="123">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Complemento</label>
                        <input type="text" class="form-control" name="complemento" id="inputComplemento" placeholder="Apto, Bloco, etc (opcional)">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Cidade</label>
                            <input type="text" class="form-control" name="cidade" id="inputCidade" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" name="estado" id="inputEstado" readonly>
                        </div>
                    </div>
                </div>

                <!-- Endereço manual (se não preencher CEP) -->
                <div class="mb-4" id="enderecoManual">
                    <label class="form-label">Ou digite o endereço completo</label>
                    <input type="text" class="form-control" name="endereco" placeholder="Rua, número, bairro, cidade (opcional)">
                </div>

                <!-- Foto -->
                <div class="mb-4">
                    <label class="form-label">Foto 3x4</label>
                    <div class="foto-preview" id="fotoPreview">
                        <i class="fas fa-camera"></i>
                    </div>
                    <input type="file" class="form-control" name="foto" id="inputFoto" accept="image/jpeg,image/jpg,image/png">
                    <small class="text-muted">Opcional - Formato JPG ou PNG (máx. 5MB)</small>
                </div>

                <!-- Botão Submit -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">
                        <i class="fas fa-check-circle me-2"></i>Finalizar Cadastro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cadastro-aluno.js"></script>
</body>
</html>
