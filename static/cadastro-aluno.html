<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .form-header h2 {
            color: #1f2937;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-label .required {
            color: #ef4444;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.25);
        }

        .foto-preview {
            width: 150px;
            height: 200px;
            border: 3px dashed #d1d5db;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            overflow: hidden;
            background: #f9fafb;
        }

        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-preview i {
            font-size: 3rem;
            color: #9ca3af;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-voltar {
            color: #6b7280;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .btn-voltar:hover {
            color: var(--primary-color);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <a href="index.html" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>

            <div class="form-header">
                <i class="fas fa-user-graduate"></i>
                <h2>Cadastro do Aluno</h2>
                <p class="text-muted">Preencha seus dados abaixo</p>
            </div>

            <div id="alertContainer"></div>

            <form id="formAluno" enctype="multipart/form-data">
                <!-- Dados Pessoais -->
                <div class="mb-4">
                    <label class="form-label">Nome Completo <span class="required">*</span></label>
                    <input type="text" class="form-control" name="nome" required>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Turma <span class="required">*</span></label>
                        <input type="text" class="form-control" name="turma" placeholder="Ex: 3º A" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ano de Formatura <span class="required">*</span></label>
                        <input type="number" class="form-control" name="ano_formatura" min="2024" max="2030" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Escola <span class="required">*</span></label>
                    <input type="text" class="form-control" name="escola" placeholder="Nome da escola" required>
                </div>

                <!-- Contato -->
                <div class="mb-4">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" name="email" placeholder="seuemail@exemplo.com">
                    <small class="text-muted">Opcional</small>
                </div>

                <div class="mb-4">
                    <label class="form-label">WhatsApp</label>
                    <input type="text" class="form-control" name="whatsapp" placeholder="(00) 00000-0000" maxlength="15">
                    <small class="text-muted">Opcional - Formato: (XX) XXXXX-XXXX</small>
                </div>

                <!-- Endereço -->
                <div class="mb-4">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" name="cep" placeholder="00000-000" maxlength="9">
                    <small class="text-muted">Opcional - Formato: XXXXX-XXX</small>
                </div>

                <div class="mb-4">
                    <label class="form-label">Endereço Completo</label>
                    <input type="text" class="form-control" name="endereco" placeholder="Rua, número, bairro, cidade">
                    <small class="text-muted">Opcional</small>
                </div>

                <!-- Foto -->
                <div class="mb-4">
                    <label class="form-label">Foto 3x4</label>
                    <div class="foto-preview" id="fotoPreview">
                        <i class="fas fa-camera"></i>
                    </div>
                    <input type="file" class="form-control" name="foto" id="inputFoto" accept="image/jpeg,image/jpg,image/png">
                    <small class="text-muted">Opcional - Formato JPG ou PNG (máx. 5MB)</small>
                </div>

                <!-- Botão Submit -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">
                        <i class="fas fa-check-circle me-2"></i>Finalizar Cadastro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cadastro-aluno.js"></script>
</body>
</html>
