<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos – Sistema de Formandos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--gold:#F6A21E;--gold-dark:#C57F17;--black:#0D0D0D;--bg:#FFE0B3;}
body{background:var(--bg);font-family:'Segoe UI',sans-serif}
.container-box{max-width:1100px;margin:40px auto}
.card{border:1px solid rgba(246,162,30,.25);box-shadow:0 8px 20px rgba(0,0,0,.05)}
.btn-gold{background:var(--gold);color:var(--black);border:none}
.btn-gold:hover{background:var(--gold-dark);color:#fff}
.table thead th{background:var(--gold);color:#000}
.badge{font-weight:600}
</style>
</head>
<body>
<div class="container-box">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0"><i class="fas fa-calendar-check me-2"></i>Eventos</h2>
    <div>
      <a href="dashboard.html" class="btn btn-outline-dark me-2"><i class="fas fa-arrow-left me-1"></i>Dashboard</a>
      <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalNovoEvento"><i class="fas fa-plus me-1"></i>Novo Evento</button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control" id="buscaEvento" placeholder="Buscar por escola...">
        </div>
        <div class="col-md-6 text-end">
          <small class="text-muted">Clique em <i class="fas fa-qrcode"></i> para ver/baixar o QR Code.</small>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Escola</th>
              <th>Tipo</th>
              <th>Data</th>
              <th>Status</th>
              <th>QR</th>
            </tr>
          </thead>
          <tbody id="tabelaEventos">
            <tr><td colspan="6" class="text-center text-muted py-3">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal QR -->
<div class="modal fade" id="modalQRCode" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#F6A21E">
        <h5 class="modal-title">QR Code do Evento</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="imgQRCode" alt="QR Code" class="img-fluid mb-2"/>
        <div>
          <a id="linkEvento" href="#" target="_blank"></a>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnDownloadQR" class="btn btn-gold"><i class="fas fa-download me-1"></i>Baixar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Novo Evento -->
<div class="modal fade" id="modalNovoEvento" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header" style="background:#F6A21E">
      <h5 class="modal-title">Criar Novo Evento</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <form id="formNovoEvento">
        <div class="mb-3">
          <label class="form-label">Escola</label>
          <input type="text" class="form-control" name="escola" maxlength="120" required
                 placeholder="Ex: Escola São José ou Colégio Monte Alegre">
        </div>
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" name="cidade" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Estado (UF)</label>
            <input type="text" class="form-control" name="estado" maxlength="2" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo de Formatura</label>
          <select class="form-select" name="tipo_formatura" required>
            <option value="Fundamental">Fundamental</option>
            <option value="Médio">Médio</option>
            <option value="Infantil">Infantil</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Data do Evento</label>
          <input type="date" class="form-control" name="data_evento">
        </div>
        <div class="mb-3">
          <label class="form-label">Local do Evento</label>
          <input type="text" class="form-control" name="local_evento" required
                 placeholder="Ex: Auditório Central — Escola São José">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-gold" onclick="criarEvento()"><i class="fas fa-save me-1"></i>Salvar</button>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/eventos.js"></script>
</body>
</html>
