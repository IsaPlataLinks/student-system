<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - R3 Formaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #764800;
            --secondary-color: #8b5a0b;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .logo-container img {
            max-width: 70px;
            height: auto;
        }

        .login-header h2 {
            color: #1f2937;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            padding: 1rem 0.75rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(30, 64, 175, 0.25);
        }

        .input-group-text {
            background: transparent;
            border: 2px solid #e5e7eb;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .btn-voltar {
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .btn-voltar:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>

        <div class="login-card">
            <div class="login-header">
                <h2>Área Administrativa</h2>
            </div>

            <div id="alertContainer"></div>

            <form id="formLogin">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" class="form-control" name="login" placeholder="Usuário" required autofocus>
                </div>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" name="senha" id="inputSenha" placeholder="Senha" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha" style="border-radius: 0 10px 10px 0;">
                        <i class="fas fa-eye" id="iconOlho"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-login" id="btnLogin">
                    <i class="fas fa-sign-in-alt me-2"></i>Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API_URL = `${window.location.origin}/api`;

      // Toggle mostrar/ocultar senha
      document.getElementById('toggleSenha').addEventListener('click', function() {
          const inputSenha = document.getElementById('inputSenha');
          const iconOlho = document.getElementById('iconOlho');
          
          if (inputSenha.type === 'password') {
              inputSenha.type = 'text';
              iconOlho.classList.remove('fa-eye');
              iconOlho.classList.add('fa-eye-slash');
          } else {
              inputSenha.type = 'password';
              iconOlho.classList.remove('fa-eye-slash');
              iconOlho.classList.add('fa-eye');
          }
      });

      // Envio do formulário
      document.getElementById('formLogin').addEventListener('submit', async function(e) {
          e.preventDefault();

          const btnLogin = document.getElementById('btnLogin');
          const formData = new FormData(e.target);
          
          const dados = {
              login: formData.get('login'),
              senha: formData.get('senha')
          };

          btnLogin.disabled = true;
          btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Entrando...';

          try {
              const response = await fetch(`${API_URL}/login`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(dados)
              });

              const resultado = await response.json();

              if (response.ok) {
                  localStorage.setItem('token', resultado.token);
                  localStorage.setItem('nomeUsuario', resultado.nome);
                  localStorage.setItem('tipoUsuario', resultado.tipo_usuario);

                  mostrarAlerta('Login realizado! Redirecionando...', 'success');
                  setTimeout(() => {
                      window.location.href = 'dashboard.html';
                  }, 1000);
              } else {
                  mostrarAlerta(resultado.erro || 'Usuário ou senha inválidos', 'danger');
                  btnLogin.disabled = false;
                  btnLogin.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Entrar';
              }
          } catch (error) {
              console.error('Erro:', error);
              mostrarAlerta('Erro de conexão. Verifique se o servidor está rodando.', 'danger');
              btnLogin.disabled = false;
              btnLogin.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Entrar';
          }
      });

      function mostrarAlerta(mensagem, tipo) {
          const alertContainer = document.getElementById('alertContainer');
          const alert = document.createElement('div');
          alert.className = `alert alert-${tipo} alert-dismissible fade show`;
          alert.role = 'alert';
          alert.innerHTML = `
              ${mensagem}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          `;
          alertContainer.innerHTML = '';
          alertContainer.appendChild(alert);

          setTimeout(() => {
              alert.remove();
          }, 5000);
      }

      if (localStorage.getItem('token')) {
          window.location.href = 'dashboard.html';
      }
    </script>
</body>
</html>
