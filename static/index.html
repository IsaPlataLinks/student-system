<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R3 Formaturas - Sistema de Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/animations.css" rel="stylesheet">
  <style>
    :root {
      --background-gold: #FFE0B3; /* cor sólida do fundo */
      --gold: #F6A21E;
      --gold-dark: #C57F17;
      --black: #0D0D0D;
      --gray-dark: #333333;
      --white: #FFFFFF;
    }

    body {
      min-height: 100vh;
      background: var(--background-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--black);
      padding: 2rem 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(246, 162, 30, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(246, 162, 30, 0.08) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(50px, 50px); }
    }

    .container-principal {
      max-width: 600px;
      padding: 20px;
    }

    .card-boas-vindas {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 3rem;
      text-align: center;
      animation: fadeInDown 0.6s ease-out;
    }

    .logo-container img {
      max-width: 110px;
      margin-bottom: 1.2rem;
    }

    .card-boas-vindas h1 {
      color: var(--black);
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
    }

    .card-boas-vindas p {
      color: var(--gray-dark);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }

    .info-box {
      background: #fff7e9;
      border-left: 4px solid var(--gold);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      margin-top: 2rem;
      text-align: left;
      box-shadow: 0 2px 8px rgba(246, 162, 30, 0.15);
    }

    .info-box p {
      color: var(--gray-dark);
      font-size: 0.95rem;
      margin: 0;
    }

.btn-admin {
  background: var(--gold); /* cor sólida do botão */
  color: var(--black);
  border: none;
  padding: 0.85rem 2rem;
  border-radius: 10px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: all 0.3s ease;
  font-size: 1.1rem;
  position: relative;
  overflow: hidden;
}

.btn-admin::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
  z-index: -1;
}

.btn-admin:hover::before {
  width: 300px;
  height: 300px;
}

.btn-admin:hover {
  transform: translateY(-2px);
  background: var(--black);
  color: var(--gold);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

    .footer-info {
      text-align: center;
      color: var(--gray-dark);
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==================== SCROLL CUSTOMIZADO ==================== */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
      border: 2px solid #f1f5f9;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-dark);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--gold) #f1f5f9;
    }

    @media (max-width: 768px) {
      .card-boas-vindas h1 {
        font-size: 2rem;
      }
      .card-boas-vindas {
        padding: 2rem;
      }
      .logo-container img {
        max-width: 70px;
      }
    }
  </style>
</head>
<body class="hero-parallax">
  <div class="container-principal">
    <div class="card-boas-vindas">
      <div class="logo-container">
        <img src="https://i.ibb.co/6RvMh1cL/logo.png" alt="Logo R3 Formaturas">
      </div>
      <h1>Bem-vindo!</h1>
      <p>Sistema de Cadastro de Formandos<br>
      Registre seus dados e receba as fotos da formatura!</p>

      <div class="info-box">
        <p>
          <i class="fas fa-info-circle me-2" style="color: var(--gold);"></i>
          <strong>Para se cadastrar:</strong> Use o link ou QR Code fornecido no evento de formatura pela equipe R3.
        </p>
      </div>

      <div class="footer-info">
        <p>
          <i class="fas fa-shield-alt me-2" style="color: var(--gold);"></i>
          Seus dados estão seguros e protegidos
        </p>
        <a href="login.html" class="btn-admin mt-3">
          <i class="fas fa-sign-in-alt me-2"></i>Área Administrativa
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/ui-enhancements.js"></script>
  <script>
    // Inicializar ripple effect para botão admin
    document.addEventListener('DOMContentLoaded', function() {
      const btnAdmin = document.querySelector('.btn-admin');
      if (btnAdmin) {
        btnAdmin.addEventListener('click', function(e) {
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');
          
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;
          
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          ripple.style.animation = 'ripple-animation 0.6s ease-out';
          
          this.insertBefore(ripple, this.firstChild);
          
          setTimeout(() => ripple.remove(), 600);
        });
      }
    });
  </script>
</body>
</html>
