<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R3 Formaturas - Sistema de Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --gold: #F6A21E;
      --gold-dark: #C57F17;
      --black: #0D0D0D;
      --gray-dark: #1C1C1C;
      --white-soft: #F9F9F9;
      --gray-light: #E5E5E5;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--black) 0%, var(--gray-dark) 60%, var(--gold-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--white-soft);
      padding: 2rem 0;
    }

    .container-principal {
      max-width: 600px;
      padding: 20px;
    }

    .card-boas-vindas {
      background: rgba(20, 20, 20, 0.95);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      padding: 3rem;
      text-align: center;
      animation: fadeInDown 0.6s ease-out;
      border: 1px solid rgba(246, 162, 30, 0.3);
    }

    .logo-icon {
      font-size: 4rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .card-boas-vindas h1 {
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .card-boas-vindas p {
      color: var(--gray-light);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--gold);
      padding: 1.2rem;
      border-radius: 12px;
      margin-top: 2rem;
      text-align: left;
    }

    .info-box p {
      color: var(--white-soft);
      font-size: 0.95rem;
      margin: 0;
    }

    .btn-admin {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--black);
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .btn-admin:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(246, 162, 30, 0.5);
      color: var(--black);
    }

    .footer-info {
      text-align: center;
      color: var(--gray-light);
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .card-boas-vindas h1 {
        font-size: 2rem;
      }
      .card-boas-vindas {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-principal">
    <div class="card-boas-vindas">
      <i class="fas fa-graduation-cap logo-icon"></i>
      <h1>Bem-vindo!</h1>
      <p>Sistema de Cadastro de Formandos<br>
      Registre seus dados e receba as fotos da formatura!</p>

      <div class="info-box">
        <p>
          <i class="fas fa-info-circle me-2" style="color: var(--gold);"></i>
          <strong>Para se cadastrar:</strong> Use o link ou QR Code fornecido no evento de formatura pela equipe R3.
        </p>
      </div>

      <div class="footer-info">
        <p>
          <i class="fas fa-shield-alt me-2" style="color: var(--gold);"></i>
          Seus dados estão seguros e protegidos
        </p>
        <a href="login.html" class="btn-admin mt-3">
          <i class="fas fa-sign-in-alt me-2"></i>Área Administrativa
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
