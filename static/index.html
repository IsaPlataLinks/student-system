<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3 Formaturas - Sistema de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --accent-color: #ec4899;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 50%, var(--accent-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }

        .container-principal {
            max-width: 900px;
            padding: 20px;
        }

        .card-boas-vindas {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .card-boas-vindas h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .card-boas-vindas p {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .opcoes-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .card-opcao {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card-opcao:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.4);
        }

        .card-opcao i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-opcao h3 {
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .card-opcao p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .btn-admin {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.4);
            color: white;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .opcoes-container {
                grid-template-columns: 1fr;
            }

            .card-boas-vindas h1 {
                font-size: 2rem;
            }
        }

        .footer-info {
            text-align: center;
            color: white;
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .alert-info {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 5px solid var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container-principal">
        <!-- Card de Boas-Vindas -->
        <div class="card-boas-vindas">
            <i class="fas fa-graduation-cap" style="font-size: 4rem; color: var(--primary-color);"></i>
            <h1>Bem-vindo(a)! 🎓</h1>
            <p>Sistema de Cadastro de Formandos R3 Formaturas<br>
            Faça seu cadastro de forma rápida e segura</p>
        </div>

        <!-- Alerta: Usar QR Code do evento -->
        <div class="alert-info">
            <p class="mb-0">
                <i class="fas fa-qrcode me-2"></i>
                <strong>Atenção:</strong> Para fazer seu cadastro, escaneie o QR Code que está no banner do seu evento de formatura.
            </p>
        </div>

        <!-- Footer -->
        <div class="footer-info">
            <p>
                <i class="fas fa-shield-alt me-2"></i>
                Seus dados estão seguros e protegidos
            </p>
            <a href="login.html" class="btn-admin">
                <i class="fas fa-sign-in-alt me-2"></i>Área Administrativa
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
