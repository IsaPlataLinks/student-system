<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R3 Formaturas - Sistema de Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --background-gold: #FFE0B3; /* cor sólida do fundo */
      --gold: #F6A21E;
      --gold-dark: #C57F17;
      --black: #0D0D0D;
      --gray-dark: #333333;
      --white: #FFFFFF;
    }

    body {
      min-height: 100vh;
      background: var(--background-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--black);
      padding: 2rem 0;
    }

    .container-principal {
      max-width: 600px;
      padding: 20px;
    }

    .card-boas-vindas {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      padding: 3rem;
      text-align: center;
      animation: fadeInDown 0.6s ease-out;
      border: 1px solid rgba(246, 162, 30, 0.2);
    }

    .logo-container img {
      max-width: 90px;
      margin-bottom: 1.2rem;
    }

    .card-boas-vindas h1 {
      color: var(--black);
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
    }

    .card-boas-vindas p {
      color: var(--gray-dark);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }

    .info-box {
      background: #fff7e9;
      border-left: 4px solid var(--gold);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      margin-top: 2rem;
      text-align: left;
      box-shadow: 0 2px 8px rgba(246, 162, 30, 0.15);
    }

    .info-box p {
      color: var(--gray-dark);
      font-size: 0.95rem;
      margin: 0;
    }

.btn-admin {
  background: var(--gold); /* cor sólida do botão */
  color: var(--black);
  border: none;
  padding: 0.85rem 2rem;
  border-radius: 10px;
  font-weight: 600;
  text-decoration: none;
  display: inline-block;
  transition: all 0.3s ease;
  font-size: 1.1rem;
}

.btn-admin:hover {
  transform: translateY(-2px);
  background: var(--black);
  color: var(--gold);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

    .footer-info {
      text-align: center;
      color: var(--gray-dark);
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .card-boas-vindas h1 {
        font-size: 2rem;
      }
      .card-boas-vindas {
        padding: 2rem;
      }
      .logo-container img {
        max-width: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="container-principal">
    <div class="card-boas-vindas">
      <div class="logo-container">
        <img src="https://i.ibb.co/6RvMh1cL/logo.png" alt="Logo R3 Formaturas">
      </div>
      <h1>Bem-vindo!</h1>
      <p>Sistema de Cadastro de Formandos<br>
      Registre seus dados e receba as fotos da formatura!</p>

      <div class="info-box">
        <p>
          <i class="fas fa-info-circle me-2" style="color: var(--gold);"></i>
          <strong>Para se cadastrar:</strong> Use o link ou QR Code fornecido no evento de formatura pela equipe R3.
        </p>
      </div>

      <div class="footer-info">
        <p>
          <i class="fas fa-shield-alt me-2" style="color: var(--gold);"></i>
          Seus dados estão seguros e protegidos
        </p>
        <a href="login.html" class="btn-admin mt-3">
          <i class="fas fa-sign-in-alt me-2"></i>Área Administrativa
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
