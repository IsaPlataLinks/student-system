<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado! - R3 Formaturas</title>

<!-- Importação do Bootstrap e Font Awesome para estilos e ícones -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<!-- CSS externo para animações personalizadas -->
<link href="/css/animations.css" rel="stylesheet">

<style>
/* Variáveis de cor utilizadas no tema */
    :root {
        --background-gold: #FFE0B3;
        --gold: #F6A21E;
        --gold-dark: #C57F17;
        --black: #0D0D0D;
        --gray-dark: #333333;
        --white: #FFFFFF;
    }

/* Estilos base do body (layout centralizado e tipografia) */
    body {
        min-height: 100vh;
        background: var(--background-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--black);
        padding: 2rem 0;
    }

/* Card principal de sucesso (container) */
    .sucesso-container {
        max-width: 650px;
        background: var(--white);
        border-radius: 24px;
        padding: 3rem;
        text-align: center;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
        animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(246, 162, 30, 0.2);
    }

/* Animação de entrada com leve salto */
    @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.3) translateY(-50px); }
        50% { transform: scale(1.05); }
        70% { transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
    }

/* Brilho diagonal sutil no container */
    .sucesso-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(246, 162, 30, 0.08), transparent);
        animation: shine 3s infinite;
    }

/* Animação do brilho */
    @keyframes shine {
        0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

/* Área do logotipo no topo do card */
    .logo-container {
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

/* Tamanho e animação do logotipo */
    .logo-container img {
        max-width: 110px;
        animation: fadeInDown 0.6s ease-out;
    }

/* Wrapper do ícone de sucesso (check) */
    .icone-sucesso {
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        position: relative;
        z-index: 1;
        animation: checkmarkDraw 0.8s ease-out;
    }

/* Animação do ícone de sucesso (escala) */
    @keyframes checkmarkDraw {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
    }

/* Estilo do ícone de sucesso */
    .icone-sucesso i {
        font-size: 7rem;
        color: var(--gold);
        text-shadow: 0 0 20px rgba(246, 162, 30, 0.3);
        animation: pulse 2s infinite;
    }

/* Pulsa o ícone para dar vida à tela */
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

/* Título principal */
    h1 {
        color: var(--black);
        font-weight: 700;
        margin-bottom: 1rem;
        font-size: 2.2rem;
        position: relative;
        z-index: 1;
        letter-spacing: 0.5px;
    }

/* Texto de mensagem de sucesso */
    .mensagem {
        color: var(--gray-dark);
        font-size: 1.1rem;
        margin-bottom: 2rem;
        line-height: 1.6;
        position: relative;
        z-index: 1;
    }

/* Box que exibe o nome cadastrado */
    .nome-cadastrado {
        background: #fff7e9;
        border-left: 5px solid var(--gold);
        padding: 1.2rem 1.5rem;
        border-radius: 12px;
        margin: 2rem 0;
        color: var(--black);
        font-weight: 600;
        font-size: 1.1rem;
        position: relative;
        z-index: 1;
        animation: slideInLeft 0.6s ease-out 0.3s both;
        box-shadow: 0 2px 8px rgba(246, 162, 30, 0.15);
    }

/* Animação de entrada lateral do nome */
    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }

/* Ícone dentro do box do nome */
    .nome-cadastrado i {
        color: var(--gold);
    }

/* Área que agrupa botões e informações de ação */
    .opcoes-container {
        position: relative;
        z-index: 1;
        margin: 2rem 0;
    }

/* Divisor com linha e texto centralizado */
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 2rem 0;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 2px solid rgba(246, 162, 30, 0.2);
    }

    .divider span {
        padding: 0 1rem;
        color: var(--gray-dark);
        font-weight: 600;
        font-size: 0.9rem;
    }

/* Botão para cadastrar outro filho (quando responsável) */
    .btn-cadastrar-outro {
        background: var(--gold);
        color: var(--black);
        border: none;
        padding: 1rem 2rem;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
        font-size: 1.1rem;
        box-shadow: 0 4px 15px rgba(246, 162, 30, 0.3);
        animation: fadeInUp 0.6s ease-out 0.7s both;
    }

/* Animação de entrada do botão a partir de baixo */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

/* Efeito hover do botão cadastrar outro */
    .btn-cadastrar-outro:hover {
        transform: translateY(-3px);
        background: var(--gold-dark);
        color: var(--white);
        box-shadow: 0 10px 30px rgba(246, 162, 30, 0.5);
    }

/* Ícone do botão cadastrar outro */
    .btn-cadastrar-outro i {
        font-size: 1.3rem;
    }

/* Box de informação auxiliar (texto explicativo) */
    .info-box {
        background: #fff7e9;
        border-left: 4px solid var(--gold);
        padding: 1rem 1.2rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        text-align: left;
        position: relative;
        z-index: 1;
        animation: fadeIn 0.6s ease-out 0.9s both;
        box-shadow: 0 2px 8px rgba(246, 162, 30, 0.15);
    }

/* Animação simples de fade-in */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

/* Ícone do box informativo */
    .info-box i {
        color: var(--gold);
    }

/* Texto pequeno dentro do box informativo */
    .info-box small {
        color: var(--gray-dark);
        font-size: 0.9rem;
        line-height: 1.5;
    }

/* Botão para voltar ao início */
    .btn-voltar {
        background: var(--gold);
        color: var(--black);
        border: none;
        padding: 0.85rem 2.5rem;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        position: relative;
        z-index: 1;
        box-shadow: 0 4px 15px rgba(246, 162, 30, 0.3);
    }

/* Efeito hover do botão voltar */
    .btn-voltar:hover {
        transform: translateY(-3px);
        background: var(--black);
        color: var(--gold);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

/* Animação do ícone ao passar o mouse no botão voltar */
    .btn-voltar i {
        transition: transform 0.3s ease;
    }

    .btn-voltar:hover i {
        transform: translateX(-3px);
    }

/* Rodapé com mensagem de contato futuro */
    .footer-text {
        margin-top: 2rem;
        color: var(--gray-dark);
        font-size: 0.9rem;
        position: relative;
        z-index: 1;
        opacity: 0.9;
    }

    .footer-text i {
    color: var(--gold);
    }

        /* ==================== SCROLL CUSTOMIZADO ==================== */
    ::-webkit-scrollbar {
    width: 10px;
    }

    ::-webkit-scrollbar-track {
         background: #f1f5f9;
    border-radius: 10px;
    }

     ::-webkit-scrollbar-thumb {
    background: var(--gold);
    border-radius: 10px;
    border: 2px solid #f1f5f9;
     }

    ::-webkit-scrollbar-thumb:hover {
    background: var(--gold-dark);
    }

    * {
    scrollbar-width: thin;
    scrollbar-color: var(--gold) #f1f5f9;
    }

 /* Ajustes responsivos para telas menores */
     @media (max-width: 768px) {
         .sucesso-container {
             padding: 2rem 1.5rem;
             margin: 0 1rem;
         }

         h1 {
             font-size: 1.8rem;
         }

         .logo-container img {
             max-width: 80px;
         }

         .icone-sucesso {
             width: 100px;
             height: 100px;
         }

         .icone-sucesso i {
             font-size: 5rem;
         }
     }
 </style>

</head>
<body>
    <div class="sucesso-container">
        <div class="logo-container">
            <img src="https://i.ibb.co/6RvMh1cL/logo.png" alt="Logo R3 Formaturas">
        </div>
    <!-- Ícone animado de sucesso -->
    <div class="icone-sucesso">
        <i class="fas fa-check-circle"></i>
    </div>

    <!-- Título e mensagem principal -->
    <h1>Cadastro Realizado com Sucesso!</h1>
    
    <p class="mensagem">Seus dados foram salvos com segurança em nosso sistema.</p>

    <!-- Área que exibe o tipo e o nome do cadastrado -->
    <div class="nome-cadastrado" id="nomeCadastrado">
        <i class="fas fa-user-check me-2"></i>
        <span id="nomeExibir">Carregando...</span>
    </div>

    <div class="opcoes-container">
        <!-- Mostrar apenas se for RESPONSÁVEL -->
        <div id="opcaoOutroFilho" style="display: none;">
            <!-- Box explicativo para cadastro de outro filho -->
            <div class="info-box">
                <i class="fas fa-users me-2"></i>
                <small>
                    <strong>Tem mais filhos se formando?</strong><br>
                    Cadastre-os rapidamente usando os mesmos dados de contato!
                </small>
            </div>

            <!-- Botão para redirecionar ao formulário de novo cadastro -->
            <a href="#" class="btn-cadastrar-outro" id="btnCadastrarOutro">
                <i class="fas fa-plus-circle"></i>
                Cadastrar outro filho
            </a>

            <!-- Divisor visual entre ações -->
            <div class="divider">
                <span>OU</span>
            </div>
        </div>

        <!-- Botão para voltar à página inicial -->
        <a href="index.html" class="btn-voltar">
            <i class="fas fa-home me-2"></i>Voltar ao Início
        </a>
    </div>

    <!-- Mensagem de rodapé -->
    <p class="footer-text">
        <i class="fas fa-shield-alt me-1"></i>
        Em breve entraremos em contato com você!
    </p>
</div>

<!-- Scripts do Bootstrap e melhorias de UI -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ui-enhancements.js"></script>

<script>
    // Aguarda o carregamento do DOM para iniciar a lógica de exibição
    document.addEventListener('DOMContentLoaded', function() {
        // Recupera dados do cadastro salvos no localStorage
        const dadosJSON = localStorage.getItem('cadastroSucesso');
        console.log('[DEBUG] Dados do localStorage:', dadosJSON);
        
        if (!dadosJSON) {
            console.warn('[AVISO] Nenhum dado de cadastro encontrado no localStorage');
            // Fallback: exibir mensagem genérica
            document.getElementById('nomeExibir').textContent = 'Seus dados foram cadastrados com sucesso!';
            return;
        }
        
        try {
            const dadosCadastro = JSON.parse(dadosJSON);
            console.log('[DEBUG] Dados parseados:', dadosCadastro);
            
            // Exibir nome do cadastrado
            const nomeCompleto = dadosCadastro.nome || 'Não informado';
            console.log('[DEBUG] Nome a exibir:', nomeCompleto);
            
            // Animar nome com efeito de digitação usando helper da UI
            if (window.UI && typeof window.UI.animarNome === 'function') {
                window.UI.animarNome(nomeCompleto, 'nomeExibir');
            } else {
                console.warn('[AVISO] UI.animarNome não disponível, exibindo texto direto');
                document.getElementById('nomeExibir').textContent = nomeCompleto;
            }
            
            // Mostrar opção apenas se for responsável
            if (dadosCadastro.tipo === 'responsavel') {
                document.getElementById('opcaoOutroFilho').style.display = 'block';
                
                const btnCadastrarOutro = document.getElementById('btnCadastrarOutro');
                // Ao clicar, prepara dados do responsável e redireciona ao formulário
                btnCadastrarOutro.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // Salvar dados do responsável para pré-preencher
                    const dadosResponsavel = {
                        eventoId: dadosCadastro.eventoId,
                        nomeContato: dadosCadastro.nomeContato,
                        email: dadosCadastro.email,
                        whatsapp: dadosCadastro.whatsapp,
                        tipo: 'responsavel'
                    };
                    
                    localStorage.setItem('dadosResponsavel', JSON.stringify(dadosResponsavel));
                    window.location.href = `cadastro.html?e=${dadosCadastro.eventoId}`;
                });
            }
        } catch (erro) {
            console.error('[ERRO] Falha ao parsear dados:', erro);
            document.getElementById('nomeExibir').textContent = 'Seus dados foram cadastrados com sucesso!';
        }

        // Usar confete realista da biblioteca UI se disponível
        if (window.UI && window.UI.criarConfeteRealista) {
            window.UI.criarConfeteRealista();
        } else {
            // Fallback para confete manual caso a função não exista
            criarConfete();
        }
    });

    // Efeito de confete dourado (fallback simples via Web Animations API)
    function criarConfete() {
        const cores = ['#F6A21E', '#C57F17', '#FFB84D', '#0D0D0D', '#FFE0B3'];
        const formas = ['circle', 'square'];
        
        for (let i = 0; i < 60; i++) {
            setTimeout(() => {
                // Cria um elemento confete com tamanho, cor e forma aleatórios
                const confete = document.createElement('div');
                const forma = formas[Math.floor(Math.random() * formas.length)];
                const tamanho = Math.random() * 8 + 5;
                
                confete.style.cssText = `
                    position: fixed;
                    width: ${tamanho}px;
                    height: ${tamanho}px;
                    background: ${cores[Math.floor(Math.random() * cores.length)]};
                    top: -20px;
                    left: ${Math.random() * 100}%;
                    opacity: 1;
                    border-radius: ${forma === 'circle' ? '50%' : '2px'};
                    pointer-events: none;
                    z-index: 9999;
                    box-shadow: 0 0 10px rgba(0,0,0,0.1);
                `;
                document.body.appendChild(confete);

                // Define parâmetros de animação (queda com leve deslocamento e rotação)
                const rotacao = Math.random() * 360;
                const deslocamentoX = (Math.random() - 0.5) * 200;
                
                const animacao = confete.animate([
                    { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 50}px) translateX(${deslocamentoX}px) rotate(${rotacao}deg)`, opacity: 0 }
                ], {
                    duration: 3000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                // Remove o elemento após o término da animação
                animacao.onfinish = () => confete.remove();
            }, i * 30);
        }
    }

    // Easter egg: Clicar no ícone cria mais confetes
    const iconeSuccesso = document.querySelector('.icone-sucesso');
    if (iconeSuccesso) {
        iconeSuccesso.style.cursor = 'pointer';
        iconeSuccesso.addEventListener('click', function() {
            criarConfete();
        });
    }

    // Limpar dados ao voltar para o início (evita reapresentação indevida)
    document.querySelector('.btn-voltar').addEventListener('click', function() {
        localStorage.removeItem('cadastroSucesso');
        localStorage.removeItem('dadosResponsavel');
    });
</script>
